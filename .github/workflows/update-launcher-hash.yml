name: Update launcher hash

on:
  push:
    branches: [ main ]
    paths:
      - 'Game_latest.exe'

permissions:
  contents: write

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA256 of Game_latest.exe
        run: |
          sha256sum Game_latest.exe | awk '{print $1}' > launcher_hash.txt

      - name: Commit updated hash file
        run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add launcher_hash.txt
          git diff --cached --quiet || git commit -m "Auto-update launcher_hash.txt"
          git push
