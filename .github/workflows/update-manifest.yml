name: Update manifest

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!manifest.txt'
      - '!version.txt'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.txt from tracked cstrike files
        run: |
          git ls-files 'cstrike/**' > manifest.txt

      - name: Use this commit's SHA as the version
        run: |
          git rev-parse --short HEAD > version.txt

      - name: Commit updated manifest and version files
        run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add manifest.txt version.txt
          git diff --cached --quiet || git commit -m "Auto-update manifest.txt and version.txt"
          git push
